<!DOCTYPE html>
<html lang="el">

<head>
    <meta charset="UTF-8">
    <title>Foodle</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="game-container">

        <h1>Foodle</h1>

        <div id="ingredients"></div>

        <p id="scoreDisplay">Score: 0</p>

        <h3>Guesses</h3>

        <div id="guessHistory"></div>

        <input id="guessInput" type="text" placeholder="Ποιο φαγητό είναι;">

        <div id="suggestions"></div>

        <button id="guessButton">Μάντεψε</button>

        <p id="result"></p>

        
        <h3>Hints</h3>

        <button id="originHint">🌍 Καταγωγή (+1)</button>
        <p id="originDisplay"></p>
        <button id="methodHint">🔥 Τρόπος μαγειρέματος (+1)</button>
        <p id="methodDisplay"></p>

        <h3> </h3>
        <h3> </h3>

        <button id="skipButton">⏭️ Skip (+1)</button>
        <button id="giveUpButton">🏳️ Give Up</button>


    </div>

    <script src="script.js"></script>
</body>

</html>
